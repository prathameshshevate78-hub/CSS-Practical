<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>AngularJS Filters Example</title>

    <!-- AngularJS Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">

    <h2>AngularJS Filters Example</h2>

    <!-- Original Data -->
    <p><b>Original Name:</b> {{name}}</p>

    <!-- Uppercase Filter -->
    <p><b>Uppercase:</b> {{name | uppercase}}</p>

    <!-- Lowercase Filter -->
    <p><b>Lowercase:</b> {{name | lowercase}}</p>

    <!-- Currency Filter -->
    <p><b>Salary:</b> {{salary | currency}}</p>

    <!-- Date Filter -->
    <p><b>Today Date:</b> {{today | date:'dd/MM/yyyy'}}</p>

    <!-- Number Filter -->
    <p><b>Number Format:</b> {{number | number:2}}</p>

    <!-- Filter with Input -->
    Search Name: 
    <input type="text" ng-model="search">

    <ul>
        <li ng-repeat="x in names | filter:search">
            {{x}}
        </li>
    </ul>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function($scope) {
            $scope.name = "Prathamesh Shevate";
            $scope.salary = 50000;
            $scope.today = new Date();
            $scope.number = 12345.6789;

            $scope.names = ["Prathamesh", "Rahul", "Amit", "Sneha", "Pooja"];
        });
    </script>

</body>
</html>
