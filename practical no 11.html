<!DOCTYPE html>
<html>
<head>
    <title>Table Odd Even Styling</title>

    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        /* Even rows */
        tr:nth-child(even) {
            background-color: lightgray;
        }

        /* Odd rows */
        tr:nth-child(odd) {
            background-color: white;
        }

        th {
            background-color: gray;
            color: white;
        }
    </style>

</head>
<body>

    <h2>Student Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Prathamesh</td>
            <td>20</td>
            <td>Computer</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>21</td>
            <td>IT</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>22</td>
            <td>Mechanical</td>
        </tr>

        <tr>
            <td>Sneha</td>
            <td>20</td>
            <td>Electrical</td>
        </tr>

    </table>

</body>
</html>
