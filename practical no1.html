<!DOCTYPE html>
<html>
<head>
    <title>Hello World Program</title>
</head>
<body>

    <h2>JavaScript Hello World Example</h2>

    <script>
        // 1) Using console.log()
        console.log("Hello World");

        // 2) Using document.write()
        document.write("Hello World<br>");

        // 3) Using alert()
        alert("Hello World");
    </script>

</body>
</html>
